spring.application.name=cronosystem

spring.datasource.url=jdbc:h2:mem:bd_crono_teste;MODE=MySQL;DB_CLOSE_DELAY=-1
spring.datasource.username=sa
spring.datasource.password=

spring.flyway.enabled=false
spring.jpa.hibernate.ddl-auto=create-drop
spring.jpa.show-sql=false
spring.jpa.open-in-view=false

api.security.token.secret=chave-usada-somente-nos-testes-automatizados
api.security.token.expiracao-horas=1
