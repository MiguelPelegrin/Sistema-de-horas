spring.application.name=cronosystem

spring.datasource.url=jdbc:mysql://localhost:3306/cronosystem?createDatabaseIfNotExist=true&serverTimezone=UTC
spring.datasource.username=root
spring.datasource.password=

spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true

spring.flyway.enabled=true

# Troque por uma chave maior/secreta antes de ir para produção (min. 32 caracteres)
security.jwt.secret=troque-esta-chave-por-uma-bem-grande-e-secreta-0123456789
security.jwt.expiration-ms=86400000
