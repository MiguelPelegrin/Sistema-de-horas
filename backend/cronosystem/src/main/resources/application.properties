spring.application.name=cronosystem

spring.datasource.url=jdbc:mysql://localhost:3306/bd_crono?createDatabaseIfNotExist=true&serverTimezone=UTC
spring.datasource.username=root
spring.datasource.password=

spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.hibernate.ddl-auto=update
spring.flyway.baseline-on-migrate=true
spring.jpa.open-in-view=false

server.error.include-stacktrace=never
server.error.include-message=never

api.security.token.secret=${JWT_SECRET:cronos-system-chave-secreta-tcc-etec-2026}
api.security.token.expiracao-horas=8
