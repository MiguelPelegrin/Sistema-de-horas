<!DOCTYPE html>
<html lang="pt-br">

<head>
    <meta charset="UTF-8">
    <meta http-equiv="X-UA-Compatible" content="IE=edge">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login</title>

    <link rel="stylesheet" href="../Login/Css/style.css">
    <script type="module" src="../Login/Js/script.js"></script>
    </head>

<body>
    <div class="imgs">
        <img class="img-etec" src="/img/Etec/logo.png" alt="">
        <img class="img-cps" src="/img/Etec/Logo_CPS-01.png" alt="">
    </div>
    <div class="container">
        <div class="card-login">
            <img class="logo" src="/img/Logo/logo cronos escrito.png" alt="">
            <br>
            <form class="formulario">
                <input id="user" type="text" placeholder="Usuario">
                <input id="senha" type="password" placeholder="Senha">
            </form>
            <div class="btn-container">
                <button id="validacao" class="btn-login">
                    <span>Login</span>
                </button>
            </div>
            <div class="form-links">
                <a href="./Cadastro.html">Criar cadastro</a>
                <a href="./Recsenha.html">Esqueceu a senha</a>
            </div>
        </div>
    </div>

</body>
</html>
