<!DOCTYPE html>
<html lang="pt-br">

<head>
    <meta charset="UTF-8">
    <meta http-equiv="X-UA-Compatible" content="IE=edge">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login</title>
    <!--Links-->
    <link rel="stylesheet" href="/Auth/Login/Css/style.css">
    <!--Fim links-->
</head>

<body>
    <div class="imgs">
        <img class="img-etec" src="/img/Etec/logo.png" alt="">
        <img class="img-cps" src="/img/Etec/Logo_CPS-01.png" alt="">
    </div>
    <div class="container">
        <div class="card-login">
            <img class="logo" src="/img/Logo/logo cronos escrito.png" alt="">
            <br>
            <form class="formulario">
                <input type="text" placeholder="User">
                <input type="password" placeholder="Senha">
            </form>
            <div class="btn-container">
                <a href="#">
                    <button class="btn-login">
                        <span>Login</span>
                    </button>
                </a>
            </div>
            <div class="form-links">
                <a href="#">Criar cadastro</a>
                <a href="#">Esqueceu a senha</a>
            </div>
        </div>
    </div>

</body>

</html>
