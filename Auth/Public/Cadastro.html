<!DOCTYPE html>
<html lang="pt-br">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Cadastro</title>
    <!--Links-->
    <link rel="stylesheet" href="../Cadastro/Css/style.css" />
    <script type="module" src="../Cadastro/Js/script.js"></script>
    <!--Fim links-->
  </head>
  <body>
    <div class="imgs">
      <img class="img-etec" src="/img/Etec/logo.png" alt="" />
      <img class="img-cps" src="/img/Etec/Logo_CPS-01.png" alt="" />
    </div>
    <div class="container">
      <div class="card-login">
        <img class="logo" src="/img/Logo/Logo escrito sem fundo.png" alt="" />
        <br/>
        <form class="formulario">
          <input id="user" name="nome" type="text" placeholder="Usuario" autocomplete="name" />
          <input id="email" name="email" type="email" placeholder="Email" autocomplete="email" />
          <input id="senha" type="password" placeholder="Senha" />
          <input id="confirmarSenha" type="password" placeholder="Confirmar senha" autocomplete="new-password" />
        </form>
        <div class="btn-container">
          <button id="validacao" class="btn-login">
            <span>Cadastrar</span>
          </button>
        </div>
        <div class="form-links">
          <a href="/Auth/Public/Login.html">Voltar ao login</a>
        </div>
      </div>
    </div>
  </body>
</html>
