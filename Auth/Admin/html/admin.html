<!DOCTYPE html>
<html lang="pt-br">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Administração</title>
  <script src="../../Global/Js/auth.js" data-pagina="admin"></script>
  <link rel="stylesheet" href="../../Global/css/global.css">
  <link rel="stylesheet" href="../../Home/CSS/Style.css">
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet" crossorigin="anonymous">
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css">
  <link rel="stylesheet" href="../css/Style.css">
</head>
<body>
  <nav class="navbar navbar-dark fixed-top shadow-sm navbar-standard">
    <div class="container-fluid px-4">
      <a class="navbar-brand fw-bold text-uppercase d-flex align-items-center gap-2" href="./admin.html"><i class="bi bi-cpu-fill text-primary"></i> CRONOS SYSTEM</a>
      <button class="navbar-toggler border-0 shadow-none" type="button" data-bs-toggle="offcanvas" data-bs-target="#menuLateral"><span class="navbar-toggler-icon"></span></button>
      <div class="offcanvas offcanvas-end text-bg-dark border-0 shadow-lg" tabindex="-1" id="menuLateral">
        <div class="offcanvas-header border-bottom border-secondary border-opacity-25 px-4 py-3">
          <h5 class="offcanvas-title fw-bold text-uppercase"><i class="bi bi-cpu-fill text-primary"></i> CRONOS SYSTEM</h5>
          <button type="button" class="btn-close btn-close-white" data-bs-dismiss="offcanvas"></button>
        </div>
        <div class="offcanvas-body d-flex flex-column justify-content-between p-4">
          <ul class="navbar-nav gap-2">
            <li class="nav-item"><a class="nav-link active d-flex align-items-center gap-2 px-3 py-2 rounded" href="./admin.html"><i class="bi bi-building"></i> Escolas</a></li>
          </ul>
          <a class="btn btn-outline-danger w-100" href="#" onclick="sair()"><i class="bi bi-box-arrow-left me-1"></i> Sair</a>
        </div>
      </div>
    </div>
  </nav>

  <main class="conteudo-lista">
    <div class="cabecalho-lista">
      <div>
        <h1>Administração</h1>
        <p>Cadastre as escolas e o usuário de acesso de cada uma.</p>
      </div>
    </div>

    <div class="grade-admin">
      <section class="card-lista">
        <h2 class="titulo-card">Cadastrar escola</h2>
        <form id="form-escola" class="d-flex flex-column gap-3" novalidate>
          <div class="field">
            <label for="input-nome-escola">Nome da escola</label>
            <input id="input-nome-escola" maxlength="225" placeholder="ETEC Cidade do Livro">
          </div>
          <div class="field">
            <label for="input-coordenacao">Coordenação</label>
            <input id="input-coordenacao" maxlength="255" placeholder="Responsável pela coordenação">
          </div>
          <div class="field">
            <label for="input-nome-usuario">Nome do responsável pelo acesso</label>
            <input id="input-nome-usuario" maxlength="255" placeholder="Secretaria acadêmica">
          </div>
          <div class="field">
            <label for="input-email-usuario">E-mail de acesso</label>
            <input id="input-email-usuario" type="email" maxlength="255" placeholder="secretaria@etec.sp.gov.br">
          </div>
          <div class="field">
            <label for="input-senha-usuario">Senha inicial</label>
            <input id="input-senha-usuario" type="password" placeholder="Mínimo de 6 caracteres">
          </div>
          <button type="submit" class="btn btn-primary"><i class="bi bi-building-add me-1"></i> Cadastrar escola</button>
        </form>
      </section>

      <section class="card-lista">
        <h2 class="titulo-card">Escolas cadastradas</h2>
        <div id="lista-escolas" class="estado-vazio">Carregando escolas...</div>
      </section>
    </div>
  </main>

  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/js/bootstrap.bundle.min.js" crossorigin="anonymous"></script>
  <script src="../js/admin.js"></script>
</body>
</html>
