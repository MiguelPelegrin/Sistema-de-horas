<!DOCTYPE html>
<html lang="pt-br">
<head>
  <meta charset="UTF-8" />
  <meta http-equiv="X-UA-Compatible" content="IE=edge" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />

  <!-- Estilos customizados -->
  <link rel="stylesheet" href="../css/Style.css" />

  <!-- Bootstrap CSS & Ícones -->
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet" crossorigin="anonymous" />
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css" />

  <title>Turma</title>
</head>

<body>
  <!-- NAVBAR / MENU SUPERIOR -->
  <nav class="navbar navbar-dark bg-dark fixed-top shadow-sm navbar-personalizada">
    <div class="container-fluid px-4">
      <a class="navbar-brand fw-bold text-uppercase d-flex align-items-center gap-2" href="#">
        <i class="bi bi-cpu-fill text-primary"></i> CRONOS SYSTEM
      </a>

      <button class="navbar-toggler border-0 shadow-none" type="button" data-bs-toggle="offcanvas"
        data-bs-target="#menuLateralOffcanvas" aria-controls="menuLateralOffcanvas" aria-label="Alternar navegação">
        <span class="navbar-toggler-icon"></span>
      </button>

      <div class="offcanvas offcanvas-end text-bg-dark border-0 shadow-lg" tabindex="-1" id="menuLateralOffcanvas"
        aria-labelledby="tituloMenuLateral">
        <div class="offcanvas-header border-bottom border-secondary border-opacity-25 px-4 py-3">
          <h5 class="offcanvas-title fw-bold text-uppercase d-flex align-items-center gap-2" id="tituloMenuLateral">
            <i class="bi bi-cpu-fill text-primary"></i> CRONOS SYSTEM
          </h5>
          <button type="button" class="btn-close btn-close-white shadow-none" data-bs-dismiss="offcanvas" aria-label="Fechar"></button>
        </div>

        <div class="conteudo-menu-lateral d-flex flex-column justify-content-between p-4">
          <ul class="navbar-nav gap-2">
            <li class="nav-item">
              <a class="nav-link active d-flex align-items-center gap-2 px-3 py-2 rounded" href="./Home.html">
                <i class="bi bi-house-door"></i> Home
              </a>
            </li>
            <li class="nav-item">
              <a class="nav-link d-flex align-items-center gap-2 px-3 py-2 rounded" href="#">
                <i class="bi bi-person-badge"></i> Professores
              </a>
            </li>
            <li class="nav-item">
              <a class="nav-link d-flex align-items-center gap-2 px-3 py-2 rounded" href="#">
                <i class="bi bi-people"></i> Turmas
              </a>
            </li>
            <li class="nav-item">
              <a class="nav-link d-flex align-items-center gap-2 px-3 py-2 rounded" href="#">
                <i class="bi bi-book"></i> Disciplinas
              </a>
            </li>
            <li class="nav-item">
              <a class="nav-link d-flex align-items-center gap-2 px-3 py-2 rounded" href="./Planilhas.html">
                <i class="bi bi-file-earmark-spreadsheet"></i> Planilhas
              </a>
            </li>
            <li class="nav-item dropdown">
              <a class="nav-link dropdown-toggle d-flex align-items-center gap-2 px-3 py-2 rounded" href="#"
                role="button" data-bs-toggle="dropdown" aria-expanded="false">
                <i class="bi bi-plus-circle"></i> Adicionar
              </a>
              <ul id="dropdown-menu-adicionar" class="dropdown-menu dropdown-menu-dark border-secondary border-opacity-25 shadow">
                <li><a class="dropdown-item d-flex align-items-center gap-2 py-2" href="./addProfessores.html"><i class="bi bi-person-plus"></i> Professor</a></li>
                <li><a class="dropdown-item d-flex align-items-center gap-2 py-2" href="./AddTurmas.html"><i class="bi bi-people-fill"></i> Turma</a></li>
                <li><a class="dropdown-item d-flex align-items-center gap-2 py-2" href="./addDisciplinas.html"><i class="bi bi-journal-plus"></i> Disciplina</a></li>
              </ul>
            </li>
          </ul>

          <div id="container-botao-sair" class="pt-3 border-top border-secondary border-opacity-25">
            <a class="btn btn-outline-danger w-100 d-flex align-items-center justify-content-center gap-2 py-2" href="./Login.html">
              <i class="bi bi-box-arrow-left"></i> Sair
            </a>
          </div>
        </div>
      </div>
    </div>
  </nav>

  <!-- CONTEÚDO PRINCIPAL -->
  <main class="container-fluid mt-5 pt-4 px-4">
    <section class="cartao-personalizado">
      <div class="cabecalho-secao-pagina">
        <div>
          <h2>Adicionar turma</h2>
          <p class="texto-subtitulo">
            As turmas que serão adicionadas ou removidas do sistema.
          </p>
        </div>
        <button onclick="adicionarTurma()" class="btn btn-primary">Salvar</button>
      </div>

      <div class="grade-personalizada grade-2-colunas">
        <!-- Campo Ano -->
        <div class="campo-formulario-custom">
          <label for="select-ano">Ano *</label>
          <select id="select-ano" class="form-select">
            <option value="" selected disabled>Selecione o ano...</option>
            <option value="1° ANO MÉDIO">1° ANO MÉDIO</option>
            <option value="2° ANO MÉDIO">2° ANO MÉDIO</option>
            <option value="3° ANO MÉDIO">3° ANO MÉDIO</option>
          </select>
        </div>

        <!-- Campo Turno -->
        <div class="campo-formulario-custom">
          <label for="select-turno">Turno</label>
          <select id="select-turno" class="form-select">
            <option value="" selected disabled>Selecione o turno...</option>
            <option value="Matutino">Matutino (Manhã)</option>
            <option value="Noturno">Noturno (Noite)</option>
            <option value="Integral">Integral</option>
          </select>
        </div>

        <!-- Campo Curso -->
        <div class="campo-formulario-custom">
          <label for="input-curso">Curso</label>
          <input id="input-curso" class="form-control" placeholder="Ex: Desenvolvimento de sistemas" />
        </div>
      </div>
    </section>

    <!-- LISTA DE CARDS GERADOS DINAMICAMENTE -->
    <div id="container-lista-turmas" class="container-fluid mt-4 px-0"></div>
  </main>

  <!-- BOOTSTRAP JS -->
  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/js/bootstrap.bundle.min.js" crossorigin="anonymous"></script>
<script type="module" src="../js/script.js"></script>
</body>
</html>
