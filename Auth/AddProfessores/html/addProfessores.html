<!DOCTYPE html>
<html lang="pt-br">
<head>
  <meta charset="UTF-8" />
  <meta http-equiv="X-UA-Compatible" content="IE=edge" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />

  <link rel="stylesheet" href="../css/Style.css" />
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet" crossorigin="anonymous" />
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css">

  <title>Adicionar Professor</title>
</head>

<body>
  <nav class="navbar navbar-dark bg-dark fixed-top shadow-sm custom-navbar">
    <div class="container-fluid px-4">
      <a class="navbar-brand fw-bold text-uppercase tracking-wider d-flex align-items-center gap-2" href="#">
        <i class="bi bi-cpu-fill text-primary"></i> CRONOS SYSTEM
      </a>

      <button class="navbar-toggler border-0 shadow-none" type="button" data-bs-toggle="offcanvas"
        data-bs-target="#offcanvasDarkNavbar" aria-controls="offcanvasDarkNavbar" aria-label="Toggle navigation">
        <span class="navbar-toggler-icon"></span>
      </button>

      <div class="offcanvas offcanvas-end text-bg-dark border-0 shadow-lg" tabindex="-1" id="offcanvasDarkNavbar"
        aria-labelledby="offcanvasDarkNavbarLabel">
        <div class="offcanvas-header border-bottom border-secondary border-opacity-25 px-4 py-3">
          <h5 class="offcanvas-title fw-bold text-uppercase d-flex align-items-center gap-2"
            id="offcanvasDarkNavbarLabel">
            <i class="bi bi-cpu-fill text-primary"></i> CRONOS SYSTEM
          </h5>
          <button type="button" class="btn-close btn-close-white shadow-none" data-bs-dismiss="offcanvas"
            aria-label="Close"></button>
        </div>

        <div class="offcanvas-body d-flex flex-column justify-content-between p-4">
          <ul class="navbar-nav gap-2">
            <li class="nav-item">
              <a class="nav-link active d-flex align-items-center gap-2 px-3 py-2 rounded" aria-current="page"
                href="./Home.html">
                <i class="bi bi-house-door"></i> Home
              </a>
            </li>
            <li class="nav-item">
              <a class="nav-link d-flex align-items-center gap-2 px-3 py-2 rounded" href="#">
                <i class="bi bi-person-badge"></i> Professores
              </a>
            </li>
            <li class="nav-item">
              <a class="nav-link d-flex align-items-center gap-2 px-3 py-2 rounded" href="#">
                <i class="bi bi-people"></i> Turmas
              </a>
            </li>
            <li class="nav-item">
              <a class="nav-link d-flex align-items-center gap-2 px-3 py-2 rounded" href="#">
                <i class="bi bi-book"></i> Disciplinas
              </a>
            </li>
            <li class="nav-item">
              <a class="nav-link d-flex align-items-center gap-2 px-3 py-2 rounded" href="./Planilhas.html">
                <i class="bi bi-file-earmark-spreadsheet"></i> Planilhas
              </a>
            </li>
            <li class="nav-item dropdown">
              <a class="nav-link dropdown-toggle d-flex align-items-center gap-2 px-3 py-2 rounded" href="#"
                role="button" data-bs-toggle="dropdown" aria-expanded="false">
                <i class="bi bi-plus-circle"></i> Adicionar
              </a>
              <ul id="navbar-add" class="dropdown-menu dropdown-menu-dark border-secondary border-opacity-25 shadow">
                <li><a class="dropdown-item d-flex align-items-center gap-2 py-2" href="./addProfessores.html"><i
                      class="bi bi-person-plus"></i> Professor</a></li>
                <li><a class="dropdown-item d-flex align-items-center gap-2 py-2" href="./AddTurmas.html"><i
                      class="bi bi-people-fill"></i> Turma</a></li>
                <li><a class="dropdown-item d-flex align-items-center gap-2 py-2" href="./addDisciplinas.html"><i
                      class="bi bi-journal-plus"></i> Disciplina</a></li>
              </ul>
            </li>
          </ul>

          <div id="exit-event" class="pt-3 border-top border-secondary border-opacity-25">
            <a class="btn btn-outline-danger w-100 d-flex align-items-center justify-content-center gap-2 py-2"
              href="./Login.html">
              <i id="exit" class="bi bi-box-arrow-left"></i> Sair
            </a>
          </div>
        </div>
      </div>
    </div>
  </nav>

  <main class="container-fluid mt-5 pt-4 px-4">
    <!-- Renomeado classes customizadas de título -->
    <div class="cabecalho-secao-pagina mb-4">
      <div>
        <h2>Adicionar professores</h2>
        <p class="texto-subtitulo text-muted">
          Professores que serão adicionados ou removidos do sistema.
        </p>
      </div>
    </div>

    <div class="row g-3">
      <!-- IDs de inputs renomeados para ficarem claros no JS e no backend -->
      <div class="col-md-6">
        <label for="input-nome-professor" class="form-label">Nome do professor</label>
        <input id="input-nome-professor" class="form-control" placeholder="Ex: Matheus" />
      </div>

      <div class="col-md-6">
        <label for="input-sobrenome-professor" class="form-label">Sobrenome do professor</label>
        <input id="input-sobrenome-professor" class="form-control" placeholder="Ex: Silva" />
      </div>

      <div class="col-md-6">
        <label for="input-quantidade-materias" class="form-label">Número de matérias lecionadas</label>
        <input id="input-quantidade-materias" class="form-control" placeholder="Ex: 1, 2, 3" />
      </div>

      <div class="col-md-6">
        <label for="input-sigla-disciplina" class="form-label">Digite a sigla da disciplina lecionada</label>
        <div class="input-group">
          <input id="input-sigla-disciplina" class="form-control" placeholder="Ex: MAT, HIS, BIO"
            oninput="this.value = this.value.toUpperCase()" />
          <button onclick="adicionarTagDisciplina()" id="btn-adicionar-disciplina" class="btn btn-primary" type="button">
            Adicionar
          </button>
        </div>
      </div>

      <div class="col-12 mt-3">
        <label class="form-label d-block text-muted">Disciplinas vinculadas:</label>
        <div id="container-tags-disciplinas" class="d-flex flex-wrap gap-2 align-items-center w-100 p-2 border rounded bg-light"
          style="min-height: 48px;">
          <span class="text-secondary small id-mensagem-vazia">Nenhuma disciplina adicionada ainda.</span>
        </div>
      </div>
    </div>

    <!-- SEÇÃO DE DISPONIBILIDADE -->
    <div class="row mt-3 g-2">
      <div class="col-12">
        <label class="form-label d-block">Períodos disponíveis:</label>
      </div>
      
      <div class="col-md-4">
        <input type="checkbox" class="btn-check" id="checkbox-disp-manha" value="Manha" autocomplete="off">
        <label class="btn btn-outline-primary w-100 py-2" for="checkbox-disp-manha">
          <i class="bi bi-sunrise me-1"></i> Manhã 07:00 - 12:30
        </label>
      </div>

      <div class="col-md-4">
        <input type="checkbox" class="btn-check" id="checkbox-disp-tarde" value="Tarde" autocomplete="off">
        <label class="btn btn-outline-primary w-100 py-2" for="checkbox-disp-tarde">
          <i class="bi bi-sun me-1"></i> Tarde 12:30 - 15:10
        </label>
      </div>

      <div class="col-md-4">
        <input type="checkbox" class="btn-check" id="checkbox-disp-noite" value="Noite" autocomplete="off">
        <label class="btn btn-outline-primary w-100 py-2" for="checkbox-disp-noite">
          <i class="bi bi-moon-stars me-1"></i> Noite 19:00 - 22:50
        </label>
      </div>
    </div>

    <div class="my-4">
      <button onclick="salvarDadosProfessor()" class="btn btn-primary btn-lg">Salvar informações</button>
    </div>
  </main>

  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/js/bootstrap.bundle.min.js" crossorigin="anonymous"></script>

  <!-- SEU SCRIPT COMO MÓDULO -->
  <script type="module" src="../js/script.js"></script>
</body>
</html>
