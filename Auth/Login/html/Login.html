<!DOCTYPE html>
<html lang="pt-br">
  <head>
    <meta charset="UTF-8" />
    <meta http-equiv="X-UA-Compatible" content="IE=edge" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Login</title>

    <!-- O seu CSS original fica isolado e protegido de interferências -->
    <link rel="stylesheet" href="../Css/style.css" />
    <script type="module" src="../Login/Js/script.js"></script>
  </head>

  <body>
    <div class="imgs">
      <img class="img-etec" src="/Sistema-de-horas/img/Etec/logo.png" alt="" />
      <img class="img-cps" src="/Sistema-de-horas/img/Etec/Logo_CPS-01.png" alt="" />
    </div>
    <div class="container">
      <div class="card-login">
        <img class="logo" src="/Sistema-de-horas/img/Logo/Logo escrito sem fundo.png" alt="" />
        <br />
        <form class="formulario">
          <input id="user" type="text" placeholder="Usuario" />
          <input id="senha" type="password" placeholder="Senha" />
        </form>

        <div class="btn-container">
  <!-- Removido o <a href="./Home.html"> para o JS controlar o redirecionamento -->
  <button id="validacao" class="btn-login">
    <span>Login</span>
  </button>
</div>
        <div class="form-links">
          <a href="./suporte.html">
            <span id="suporte">Suporte </span>
            <svg
              xmlns="http://www.w3.org/2000/svg"
              width="16"
              height="16"
              fill="currentColor"
              class="bi bi-question-circle"
              viewBox="0 0 16 16"
            >
              <path
                d="M8 15A7 7 0 1 1 8 1a7 7 0 0 1 0 14m0 1A8 8 0 1 0 8 0a8 8 0 0 0 0 16"
              />
              <path
                d="M5.255 5.786a.237.237 0 0 0 .241.247h.825c.138 0 .248-.113.266-.25.09-.656.54-1.134 1.342-1.134.686 0 1.314.343 1.314 1.168 0 .635-.374.927-.965 1.371-.673.489-1.206 1.06-1.168 1.987l.003.217a.25.25 0 0 0 .25.246h.811a.25.25 0 0 0 .25-.25v-.105c0-.718.273-.927 1.01-1.486.609-.463 1.244-.977 1.244-2.056 0-1.511-1.276-2.241-2.673-2.241-1.267 0-2.655.59-2.75 2.286m1.557 5.763c0 .533.425.927 1.01.927.609 0 1.028-.394 1.028-.927 0-.552-.42-.94-1.029-.94-.584 0-1.009.388-1.009.94"
              />
            </svg>
          </a>
        </div>
      </div>
    </div>

    <!-- box-msg erro -->
    <div id="meuModal" class="modal-container">
        <div class="modal-conteudo">
          <h3 id="modalTitulo"></h3>
          <p id="modalMensagem"></p>
          <button id="fecharModal">Ok</button>
        </div>
      </div>    
  </body>
</html>
