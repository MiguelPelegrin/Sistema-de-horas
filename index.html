<!DOCTYPE html>
<html lang="pt-br">
  <head>
    <meta charset="UTF-8">
    <title>Cronos System</title>
  </head>
  <body>
    <script>
      const token = localStorage.getItem('cronos_token');
      let usuario = {};

      try {
        usuario = JSON.parse(localStorage.getItem('cronos_usuario')) || {};
      } catch (erro) {
        usuario = {};
      }

      if (!token) {
        window.location.replace('Auth/Login/html/login.html');
      } else if (usuario.admin) {
        window.location.replace('Auth/Admin/html/admin.html');
      } else {
        window.location.replace('Auth/Public/Home.html');
      }
    </script>
  </body>
</html>
